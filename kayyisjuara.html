<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peringkat 1 Ahlamy 3</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
}

/* =========================
   HALAMAN 1
========================= */

.page1 {
    width: 100%;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, #fff7d6 0%, transparent 28%),
        radial-gradient(circle at 80% 80%, #ffb6d9 0%, transparent 30%),
        linear-gradient(135deg, #160b22, #4b164f, #8e285e);
}

/* cahaya dekorasi */

.glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #ffd86b;
    filter: blur(150px);
    opacity: .18;
}

.glow1 {
    top: -150px;
    left: -150px;
}

.glow2 {
    bottom: -180px;
    right: -150px;
    background: #ff65b3;
}

/* kartu */

.card {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 520px;
    padding: 45px 28px;
    text-align: center;

    border: 1px solid rgba(255,255,255,.3);
    border-radius: 35px;

    background: rgba(255,255,255,.10);
    backdrop-filter: blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.3);

    animation: muncul 1.2s ease;
}

@keyframes muncul {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* mahkota */

.crown {
    font-size: 65px;
    margin-bottom: 8px;
    animation: melayang 3s ease-in-out infinite;
}

@keyframes melayang {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.small-title {
    color: #ffd76a;
    font-size: 15px;
    letter-spacing: 5px;
    font-weight: 600;
}

.rank {
    margin-top: 8px;
    font-family: 'Cinzel', serif;
    font-size: clamp(40px, 10vw, 65px);
    line-height: 1;
    font-weight: 800;

    background: linear-gradient(
        180deg,
        #fff5b0,
        #ffd45c,
        #c88618
    );

    -webkit-background-clip: text;
    color: transparent;

    text-shadow: 0 8px 30px rgba(255,204,70,.25);
}

.class {
    margin-top: 12px;
    color: white;
    font-size: 20px;
    letter-spacing: 2px;
}

.line {
    width: 80px;
    height: 3px;
    margin: 25px auto;
    border-radius: 10px;
    background: linear-gradient(90deg, transparent, #ffd45c, transparent);
}

/* tombol */

button {
    border: none;
    outline: none;
    cursor: pointer;

    padding: 15px 32px;
    border-radius: 50px;

    font-family: 'Poppins';
    font-size: 16px;
    font-weight: 700;

    color: #4b164f;

    background: linear-gradient(
        135deg,
        #fff0a3,
        #ffd052,
        #fff0a3
    );

    box-shadow:
        0 8px 30px rgba(255,205,75,.3);

    transition: .3s;
}

button:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 12px 40px rgba(255,205,75,.5);
}

button:active {
    transform: scale(.96);
}

/* bunga halaman 1 */

.flower {
    position: absolute;
    font-size: 28px;
    opacity: .7;
    animation: rotate 8s linear infinite;
}

.f1 { left: 7%; top: 15%; }
.f2 { right: 8%; top: 20%; animation-delay: 2s; }
.f3 { left: 10%; bottom: 15%; animation-delay: 4s; }
.f4 { right: 12%; bottom: 12%; animation-delay: 1s; }

@keyframes rotate {
    0% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(180deg) translateY(-15px); }
    100% { transform: rotate(360deg) translateY(0); }
}


/* =========================
   HALAMAN 2
========================= */

.page2 {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;

    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(circle at 50% 40%, #fff1f8 0%, transparent 25%),
        linear-gradient(135deg, #ffdae9, #e8d3ff);
}

/* lingkaran cahaya */

.sun {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;

    background: #fff;
    filter: blur(80px);
    opacity: .55;
}

/* isi */

.content {
    position: relative;
    z-index: 10;
    animation: zoom 1.2s ease;
}

@keyframes zoom {
    from {
        opacity: 0;
        transform: scale(.6);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.trophy {
    font-size: 70px;
    animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.congrats {
    margin-top: 10px;
    font-size: 18px;
    color: #8b4b76;
    letter-spacing: 3px;
}

.name {
    margin-top: 10px;

    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(38px, 10vw, 70px);

    background: linear-gradient(
        180deg,
        #9d3978,
        #572052
    );

    -webkit-background-clip: text;
    color: transparent;

    text-shadow: 0 8px 25px rgba(91,31,80,.15);
}

.winner {
    margin-top: 12px;
    color: #704362;
    font-size: 17px;
}

/* =========================
   BUNGA JATUH
========================= */

.falling {
    position: absolute;
    top: -60px;
    z-index: 2;

    font-size: 25px;
    pointer-events: none;

    animation-name: jatuh;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes jatuh {
    0% {
        transform:
            translateY(-60px)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg);
        opacity: .2;
    }
}

/* posisi bunga */

.a { left: 4%; animation-duration: 7s; }
.b { left: 12%; animation-duration: 10s; animation-delay: 2s; }
.c { left: 22%; animation-duration: 8s; animation-delay: 1s; }
.d { left: 33%; animation-duration: 11s; animation-delay: 3s; }
.e { left: 44%; animation-duration: 9s; animation-delay: 2s; }
.f { left: 55%; animation-duration: 12s; animation-delay: 4s; }
.g { left: 66%; animation-duration: 8s; animation-delay: 1s; }
.h { left: 77%; animation-duration: 10s; animation-delay: 3s; }
.i { left: 88%; animation-duration: 7s; animation-delay: 2s; }
.j { left: 96%; animation-duration: 11s; animation-delay: 4s; }

/* partikel */

.spark {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 15px white;
    animation: sparkle 2s infinite alternate;
}

@keyframes sparkle {
    from { opacity: .2; transform: scale(.5); }
    to { opacity: 1; transform: scale(1.5); }
}
</style>
</head>


<body>

<!-- ================= HALAMAN 1 ================= -->

<section class="page1" id="page1">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="flower f1">🌸</div>
    <div class="flower f2">🌺</div>
    <div class="flower f3">🌷</div>
    <div class="flower f4">🌸</div>

    <div class="card">

        <div class="crown">👑</div>

        <div class="small-title">
            PRESTASI TERBAIK
        </div>

        <div class="rank">
            PERINGKAT 1
        </div>

        <div class="class">
            KELAS AHLAMY 3
        </div>

        <div class="line"></div>

        <button onclick="showWinner()">
            ✨ LIHAT PEMENANG ✨
        </button>

    </div>

</section>


<!-- ================= HALAMAN 2 ================= -->

<section class="page2" id="page2">

    <div class="sun"></div>

    <!-- bunga jatuh -->

    <div class="falling a">🌸</div>
    <div class="falling b">🌺</div>
    <div class="falling c">🌷</div>
    <div class="falling d">🌸</div>
    <div class="falling e">🌺</div>
    <div class="falling f">🌷</div>
    <div class="falling g">🌸</div>
    <div class="falling h">🌺</div>
    <div class="falling i">🌷</div>
    <div class="falling j">🌸</div>

    <!-- partikel cahaya -->

    <div class="spark" style="left:15%;top:20%;"></div>
    <div class="spark" style="left:80%;top:25%;animation-delay:.5s;"></div>
    <div class="spark" style="left:25%;top:70%;animation-delay:1s;"></div>
    <div class="spark" style="left:75%;top:75%;animation-delay:1.5s;"></div>

    <div class="content">

        <div class="trophy">
            🏆
        </div>

        <div class="congrats">
            SELAMAT KEPADA
        </div>

        <div class="name">
            M AZKA KAYYIS
        </div>

        <div class="winner">
            🎉 Peringkat 1 Kelas Ahlamy 3 🎉
        </div>

    </div>

</section>


<script>

function showWinner() {

    // halaman pertama hilang
    document.getElementById("page1").style.display = "none";

    // halaman kedua muncul
    document.getElementById("page2").style.display = "flex";

    // buat confetti tambahan
    createConfetti();
}


function createConfetti() {

    const symbols = ["✨", "🌸", "🌺", "🌷", "💫"];

    for (let i = 0; i < 25; i++) {

        const item = document.createElement("div");

        item.className = "falling";

        item.innerText =
            symbols[Math.floor(Math.random() * symbols.length)];

        item.style.left = Math.random() * 100 + "%";
        item.style.fontSize =
            (15 + Math.random() * 20) + "px";

        item.style.animationDuration =
            (5 + Math.random() * 7) + "s";

        item.style.animationDelay =
            Math.random() * 4 + "s";

        document.getElementById("page2").appendChild(item);
    }
}

</script>

</body>
</html>
